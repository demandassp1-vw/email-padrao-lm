<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Email Padrão</title>
<link rel="icon" type="image/x-icon" href="favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="manifest" href="site.webmanifest">
<style>
  :root {
    --branco: #ffffff;
    --verde-claro: #8fd694;
    --verde-claro-2: #e7f7e9;
    --azul-escuro: #0d3b66;
    --azul-escuro-2: #0a2f52;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: 'Segoe UI', Arial, sans-serif;
    background: linear-gradient(180deg, var(--verde-claro-2) 0%, var(--branco) 100%);
    color: var(--azul-escuro);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    padding: 40px 16px;
  }

  .card {
    background: var(--branco);
    width: 100%;
    max-width: 480px;
    border-radius: 16px;
    box-shadow: 0 8px 28px rgba(13, 59, 102, 0.15);
    overflow: hidden;
    border-top: 6px solid var(--verde-claro);
  }

  header {
    background: var(--azul-escuro);
    padding: 22px 24px;
    text-align: center;
  }

  header h1 {
    color: var(--branco);
    margin: 0;
    font-size: 22px;
    letter-spacing: 0.5px;
  }

  header p {
    color: var(--verde-claro);
    margin: 6px 0 0;
    font-size: 13px;
  }

  .tabs {
    display: flex;
    background: transparent;
    padding: 0;
    gap: 10px;
    margin: 20px 24px 0;
    border-radius: 10px;
  }

  .tab-btn {
    flex: 1;
    border: none;
    background: var(--verde-claro-2);
    color: var(--azul-escuro);
    font-size: 13px;
    font-weight: 700;
    padding: 10px 8px;
    border-radius: 8px;
    cursor: pointer;
    transition: background 0.15s, color 0.15s;
  }

  .tab-btn.active {
    background: var(--azul-escuro);
    color: var(--branco);
  }

  .tab-btn:not(.active):hover {
    background: #d7f0da;
  }

  .painel {
    display: none;
  }

  .painel.ativo {
    display: block;
  }

  form {
    padding: 24px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  label {
    font-size: 13px;
    font-weight: 600;
    color: var(--azul-escuro);
    margin-bottom: 6px;
    display: block;
  }

  input, select {
    width: 100%;
    padding: 10px 12px;
    border: 1.5px solid #cfe8d1;
    border-radius: 8px;
    font-size: 14px;
    color: var(--azul-escuro);
    background: var(--verde-claro-2);
    transition: border-color 0.15s, box-shadow 0.15s;
    font-family: inherit;
  }

  input:focus, select:focus {
    outline: none;
    border-color: var(--azul-escuro);
    box-shadow: 0 0 0 3px rgba(13, 59, 102, 0.12);
    background: var(--branco);
  }

  .hint {
    font-size: 11px;
    color: #6b8f74;
    margin-top: 4px;
  }

  .field-group {
    display: flex;
    flex-direction: column;
  }

  .placas-wrapper {
    display: flex;
    flex-direction: column;
  }

  .placa-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 8px;
  }

  .placa-row input {
    flex: 1;
    text-transform: uppercase;
  }

  .icon-btn {
    flex-shrink: 0;
    width: 34px;
    height: 34px;
    border-radius: 8px;
    border: none;
    font-size: 18px;
    font-weight: 700;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    line-height: 1;
  }

  .add-btn {
    background: var(--verde-claro);
    color: var(--azul-escuro-2);
  }

  .add-btn:hover {
    background: #7bc981;
  }

  .remove-btn {
    background: #f5d5d5;
    color: #a33;
  }

  .remove-btn:hover {
    background: #f0c0c0;
  }

  .address-block {
    display: flex;
    flex-direction: column;
    gap: 12px;
    padding: 14px;
    border: 1.5px solid var(--verde-claro);
    border-radius: 10px;
    background: #fbfffc;
  }

  .address-title {
    font-size: 13px;
    font-weight: 700;
    color: var(--azul-escuro);
    margin-bottom: -2px;
  }

  .grid-2 {
    display: grid;
    grid-template-columns: 1fr 2fr;
    gap: 10px;
  }

  .grid-3 {
    display: grid;
    grid-template-columns: 1fr 1.5fr 0.8fr;
    gap: 10px;
  }

  .grid-2 .field-group label,
  .grid-3 .field-group label {
    font-size: 12px;
  }

  .actions {
    display: flex;
    gap: 10px;
    margin-top: 8px;
  }

  button.primary {
    flex: 2;
    background: var(--verde-claro);
    color: var(--azul-escuro-2);
    border: none;
    padding: 14px;
    border-radius: 10px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    transition: background 0.15s, transform 0.1s;
  }

  button.primary:hover {
    background: #7bc981;
  }

  button.primary:active {
    transform: scale(0.98);
  }

  button.secondary {
    flex: 1;
    background: var(--branco);
    color: var(--azul-escuro);
    border: 1.5px solid var(--azul-escuro);
    padding: 14px;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s, transform 0.1s;
  }

  button.secondary:hover {
    background: var(--verde-claro-2);
  }

  button.secondary:active {
    transform: scale(0.98);
  }

  .status {
    text-align: center;
    font-size: 12px;
    color: var(--azul-escuro);
    min-height: 16px;
  }

  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(10, 47, 82, 0.55);
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 1000;
  }

  .modal-overlay.aberto {
    display: flex;
  }

  .modal-box {
    background: var(--branco);
    border-radius: 16px;
    max-width: 380px;
    width: 100%;
    padding: 28px 24px;
    text-align: center;
    box-shadow: 0 12px 40px rgba(0, 0, 0, 0.25);
    border-top: 6px solid var(--verde-claro);
  }

  .modal-icon {
    font-size: 34px;
    margin-bottom: 8px;
  }

  .modal-box h2 {
    color: var(--azul-escuro);
    font-size: 18px;
    margin: 0 0 10px;
  }

  .modal-box p {
    color: var(--azul-escuro);
    font-size: 14px;
    line-height: 1.5;
    margin: 0 0 22px;
  }

  .modal-actions {
    display: flex;
    gap: 10px;
  }

  .modal-actions button {
    flex: 1;
    border-radius: 10px;
    padding: 12px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    border: none;
  }

  .modal-cancelar {
    background: var(--branco);
    color: var(--azul-escuro);
    border: 1.5px solid var(--azul-escuro) !important;
  }

  .modal-cancelar:hover {
    background: var(--verde-claro-2);
  }

  .modal-confirmar {
    background: var(--verde-claro);
    color: var(--azul-escuro-2);
  }

  .modal-confirmar:hover {
    background: #7bc981;
  }
</style>
</head>
<body>

<div class="card">
  <header>
    <h1>Email Padrão</h1>
    <p id="subtitulo">Solicitação de Boleto · Envio ao financeiro</p>
  </header>

  <div class="tabs">
    <button type="button" class="tab-btn active" id="tabBoletoBtn">Solicitação de Boleto</button>
    <button type="button" class="tab-btn" id="tabColetaBtn">Documentos</button>
    <button type="button" class="tab-btn" id="tabSuporteBtn">Suporte</button>
  </div>

  <!-- ===================== PAINEL: DOCUMENTOS ===================== -->
  <div class="painel" id="painelColeta">
    <form id="emailForm">
      <div class="field-group">
        <label for="destinatario">Email de destino</label>
        <select id="destinatario" required>
          <option value="natacha.silva@lm-mobilidade.com" selected>natacha.silva@lm-mobilidade.com</option>
        </select>
      </div>

      <div class="field-group">
        <label for="placa">Placa</label>
        <input type="text" id="placa" style="text-transform:uppercase" required>
      </div>

      <div class="field-group">
        <label for="loja">Nome da loja</label>
        <input type="text" id="loja" required>
      </div>

      <div class="field-group">
        <label for="cnpj">CNPJ</label>
        <input type="text" id="cnpj" required>
      </div>

      <div class="address-block">
        <span class="address-title">Dados do veículo</span>

        <div class="field-group">
          <label for="chassi">Chassi</label>
          <input type="text" id="chassi" required>
        </div>
        <div class="field-group">
          <label for="renavam">Renavam</label>
          <input type="text" id="renavam" required>
        </div>
        <div class="field-group">
          <label for="hodometro">Hodômetro</label>
          <input type="text" id="hodometro" required>
        </div>
        <div class="field-group">
          <label for="valorVenda">Valor Venda</label>
          <input type="text" id="valorVenda" required>
        </div>
        <div class="field-group">
          <label for="modelo">Modelo</label>
          <input type="text" id="modelo" required>
        </div>
        <div class="field-group">
          <label for="marca">Marca</label>
          <input type="text" id="marca" required>
        </div>
        <div class="field-group">
          <label for="ufEmplacamento">UF Emplacamento</label>
          <select id="ufEmplacamento" required>
            <option value="" disabled selected></option>
            <option>AC</option><option>AL</option><option>AP</option><option>AM</option>
            <option>BA</option><option>CE</option><option>DF</option><option>ES</option>
            <option>GO</option><option>MA</option><option>MT</option><option>MS</option>
            <option>MG</option><option>PA</option><option>PB</option><option>PR</option>
            <option>PE</option><option>PI</option><option>RJ</option><option>RN</option>
            <option>RS</option><option>RO</option><option>RR</option><option>SC</option>
            <option>SP</option><option>SE</option><option>TO</option>
          </select>
        </div>
      </div>

      <div class="address-block">
        <span class="address-title">Dados do cliente</span>

        <div class="field-group">
          <label for="cpfCnpjCliente">CPF/CNPJ</label>
          <input type="text" id="cpfCnpjCliente" required>
        </div>
        <div class="field-group">
          <label for="rgCliente">RG</label>
          <input type="text" id="rgCliente" required>
        </div>
        <div class="field-group">
          <label for="emailCliente">Email</label>
          <input type="email" id="emailCliente" required>
        </div>
        <div class="field-group">
          <label for="cepCliente">CEP</label>
          <input type="text" id="cepCliente" required>
        </div>
        <div class="field-group">
          <label for="ufCliente">UF</label>
          <select id="ufCliente" required>
            <option value="" disabled selected></option>
            <option>AC</option><option>AL</option><option>AP</option><option>AM</option>
            <option>BA</option><option>CE</option><option>DF</option><option>ES</option>
            <option>GO</option><option>MA</option><option>MT</option><option>MS</option>
            <option>MG</option><option>PA</option><option>PB</option><option>PR</option>
            <option>PE</option><option>PI</option><option>RJ</option><option>RN</option>
            <option>RS</option><option>RO</option><option>RR</option><option>SC</option>
            <option>SP</option><option>SE</option><option>TO</option>
          </select>
        </div>
        <div class="field-group">
          <label for="cidadeCliente">Cidade</label>
          <input type="text" id="cidadeCliente" required>
        </div>
        <div class="field-group">
          <label for="enderecoCliente">Endereço</label>
          <input type="text" id="enderecoCliente" required>
        </div>
        <div class="field-group">
          <label for="numeroCliente">Nº</label>
          <input type="text" id="numeroCliente" required>
        </div>
        <div class="field-group">
          <label for="complementoCliente">Complemento</label>
          <input type="text" id="complementoCliente">
        </div>
        <div class="field-group">
          <label for="bairroCliente">Bairro</label>
          <input type="text" id="bairroCliente" required>
        </div>
      </div>

      <div class="address-block">
        <span class="address-title">Dados da loja</span>

        <div class="field-group">
          <label for="emailLoja">Email</label>
          <input type="email" id="emailLoja" required>
        </div>
        <div class="field-group">
          <label for="produtoLoja">Produto</label>
          <input type="text" id="produtoLoja" required>
        </div>
        <div class="field-group">
          <label for="razaoSocialLoja">Razão Social</label>
          <input type="text" id="razaoSocialLoja" required>
        </div>
      </div>

      <div class="actions">
        <button type="submit" class="primary">Gerar email</button>
        <button type="button" class="secondary" id="limparBtn">Limpar</button>
      </div>
      <div class="status" id="status"></div>
    </form>
  </div>

  <!-- ===================== PAINEL: SOLICITAÇÃO DE BOLETO ===================== -->
  <div class="painel ativo" id="painelBoleto">
    <form id="boletoForm">
      <div class="field-group">
        <label for="destinatarioBoleto">Email de destino</label>
        <select id="destinatarioBoleto" required>
          <option value="tiago.freitas@lm-mobilidade.com.br,simone.ribeiro@lm-mobilidade.com.br" selected>tiago.freitas@lm-mobilidade.com.br; simone.ribeiro@lm-mobilidade.com.br</option>
        </select>
      </div>

      <div class="field-group">
        <label for="lojaBoleto">Nome da loja</label>
        <input type="text" id="lojaBoleto" required>
      </div>

      <div class="field-group">
        <label for="cnpjBoleto">CNPJ</label>
        <input type="text" id="cnpjBoleto" required>
      </div>

      <div class="field-group">
        <label for="placaBoleto">Placa</label>
        <input type="text" id="placaBoleto" style="text-transform:uppercase" required>
      </div>

      <div class="field-group">
        <label for="valorBoletoInput">Valor</label>
        <input type="text" id="valorBoletoInput" required>
      </div>

      <div class="address-block">
        <span class="address-title">Endereço da loja</span>
        <div class="field-group">
          <label style="margin-top:-4px;">(Rua, Número, Bairro, Cidade, CEP)</label>
        </div>

        <div class="field-group">
          <label for="ruaEnvioBoleto">Rua/Avenida</label>
          <input type="text" id="ruaEnvioBoleto" required>
        </div>

        <div class="grid-2">
          <div class="field-group">
            <label for="numeroEnvioBoleto">Nº</label>
            <input type="text" id="numeroEnvioBoleto" required>
          </div>
          <div class="field-group">
            <label for="bairroEnvioBoleto">Bairro</label>
            <input type="text" id="bairroEnvioBoleto" required>
          </div>
        </div>

        <div class="grid-3">
          <div class="field-group">
            <label for="cepEnvioBoleto">CEP</label>
            <input type="text" id="cepEnvioBoleto" required>
          </div>
          <div class="field-group">
            <label for="cidadeEnvioBoleto">Cidade</label>
            <input type="text" id="cidadeEnvioBoleto" required>
          </div>
          <div class="field-group">
            <label for="ufEnvioBoleto">UF</label>
            <select id="ufEnvioBoleto" required>
              <option value="" disabled selected></option>
              <option>AC</option><option>AL</option><option>AP</option><option>AM</option>
              <option>BA</option><option>CE</option><option>DF</option><option>ES</option>
              <option>GO</option><option>MA</option><option>MT</option><option>MS</option>
              <option>MG</option><option>PA</option><option>PB</option><option>PR</option>
              <option>PE</option><option>PI</option><option>RJ</option><option>RN</option>
              <option>RS</option><option>RO</option><option>RR</option><option>SC</option>
              <option>SP</option><option>SE</option><option>TO</option>
            </select>
          </div>
        </div>
      </div>

      <div class="field-group">
        <label for="nomeClienteBoleto">Nome do cliente</label>
        <input type="text" id="nomeClienteBoleto" required>
      </div>

      <div class="field-group">
        <label for="cpfBoleto">CPF/CNPJ</label>
        <input type="text" id="cpfBoleto" required>
      </div>

      <div class="address-block">
        <span class="address-title">Endereço do cliente</span>
        <div class="field-group">
          <label style="margin-top:-4px;">(Rua, Número, Bairro, Cidade, CEP)</label>
        </div>

        <div class="field-group">
          <label for="ruaClienteBoleto">Rua/Avenida</label>
          <input type="text" id="ruaClienteBoleto" required>
        </div>

        <div class="grid-2">
          <div class="field-group">
            <label for="numeroClienteBoleto">Nº</label>
            <input type="text" id="numeroClienteBoleto" required>
          </div>
          <div class="field-group">
            <label for="bairroClienteBoleto">Bairro</label>
            <input type="text" id="bairroClienteBoleto" required>
          </div>
        </div>

        <div class="grid-3">
          <div class="field-group">
            <label for="cepClienteBoleto">CEP</label>
            <input type="text" id="cepClienteBoleto" required>
          </div>
          <div class="field-group">
            <label for="cidadeClienteBoleto">Cidade</label>
            <input type="text" id="cidadeClienteBoleto" required>
          </div>
          <div class="field-group">
            <label for="ufClienteBoleto">UF</label>
            <select id="ufClienteBoleto" required>
              <option value="" disabled selected></option>
              <option>AC</option><option>AL</option><option>AP</option><option>AM</option>
              <option>BA</option><option>CE</option><option>DF</option><option>ES</option>
              <option>GO</option><option>MA</option><option>MT</option><option>MS</option>
              <option>MG</option><option>PA</option><option>PB</option><option>PR</option>
              <option>PE</option><option>PI</option><option>RJ</option><option>RN</option>
              <option>RS</option><option>RO</option><option>RR</option><option>SC</option>
              <option>SP</option><option>SE</option><option>TO</option>
            </select>
          </div>
        </div>
      </div>

      <div class="field-group">
        <label for="emailBoleto">Email para envio do boleto</label>
        <input type="email" id="emailBoleto" required>
      </div>

      <div class="actions">
        <button type="submit" class="primary">Gerar email</button>
        <button type="button" class="secondary" id="limparBoletoBtn">Limpar</button>
      </div>
      <div class="status" id="statusBoleto"></div>
    </form>
  </div>

  <!-- ===================== PAINEL: SUPORTE ===================== -->
  <div class="painel" id="painelSuporte">
    <form id="suporteForm">
      <div class="field-group">
        <label for="destinatarioSuporte">Email de destino</label>
        <select id="destinatarioSuporte" required>
          <option value="seminovos@vwfs.com" selected>seminovos@vwfs.com</option>
        </select>
      </div>

      <div class="field-group">
        <label for="lojaSuporte">Nome da loja</label>
        <input type="text" id="lojaSuporte" required>
      </div>

      <div class="field-group">
        <label for="cnpjSuporte">CNPJ</label>
        <input type="text" id="cnpjSuporte" required>
      </div>

      <div class="field-group">
        <label for="placaSuporte">Placa</label>
        <input type="text" id="placaSuporte" style="text-transform:uppercase" required>
      </div>

      <div class="field-group">
        <label for="dataRetiradaSuporte">Data da retirada</label>
        <input type="date" id="dataRetiradaSuporte" required>
      </div>

      <div class="field-group">
        <label for="assuntoSuporte">Assunto</label>
        <select id="assuntoSuporte" required>
          <option value="" disabled selected>Selecione o assunto</option>
          <option value="Multa de Trânsito">Multa de Trânsito</option>
          <option value="Chave Reserva">Chave Reserva</option>
          <option value="Boleto com erro">Boleto com erro</option>
          <option value="Envio do documento">Envio do documento</option>
        </select>
      </div>

      <div class="field-group" id="dataPgtoBoletoGroup" style="display:none;">
        <label for="dataPgtoBoletoSuporte">Data do pgto do boleto</label>
        <input type="date" id="dataPgtoBoletoSuporte">
      </div>

      <div class="field-group" id="descricaoPreviewGroup" style="display:none;">
        <label>Descrição do problema</label>
        <p id="descricaoPreview" class="hint" style="font-size:13px; background:var(--verde-claro-2); padding:10px 12px; border-radius:8px; margin:0;"></p>
      </div>

      <div class="actions">
        <button type="submit" class="primary">Gerar email</button>
        <button type="button" class="secondary" id="limparSuporteBtn">Limpar</button>
      </div>
      <div class="status" id="statusSuporte"></div>
    </form>
  </div>
</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal-box">
    <div class="modal-icon">⚠️</div>
    <h2>Atenção</h2>
    <p id="modalMensagem"></p>
    <div class="modal-actions">
      <button type="button" class="modal-cancelar" id="modalCancelar">Voltar</button>
      <button type="button" class="modal-confirmar" id="modalConfirmar">Abrir email</button>
    </div>
  </div>
</div>

<script>
  /* ===================== MODAL DE ATENÇÃO ===================== */
  const modalOverlay = document.getElementById('modalOverlay');
  const modalMensagem = document.getElementById('modalMensagem');
  const modalCancelar = document.getElementById('modalCancelar');
  const modalConfirmar = document.getElementById('modalConfirmar');

  let linkPendente = null;
  let statusPendente = null;

  function abrirModal(mensagem, link, statusEl) {
    modalMensagem.textContent = mensagem;
    linkPendente = link;
    statusPendente = statusEl;
    modalOverlay.classList.add('aberto');
  }

  function fecharModal() {
    modalOverlay.classList.remove('aberto');
    linkPendente = null;
    statusPendente = null;
  }

  modalCancelar.addEventListener('click', fecharModal);

  modalOverlay.addEventListener('click', (e) => {
    if (e.target === modalOverlay) fecharModal();
  });

  modalConfirmar.addEventListener('click', () => {
    if (linkPendente) {
      window.location.href = linkPendente;
      if (statusPendente) statusPendente.textContent = 'Abrindo seu programa de email...';
    }
    fecharModal();
  });

  /* ===================== NAVEGAÇÃO ENTRE ABAS ===================== */
  const tabColetaBtn = document.getElementById('tabColetaBtn');
  const tabBoletoBtn = document.getElementById('tabBoletoBtn');
  const tabSuporteBtn = document.getElementById('tabSuporteBtn');
  const painelColeta = document.getElementById('painelColeta');
  const painelBoleto = document.getElementById('painelBoleto');
  const painelSuporte = document.getElementById('painelSuporte');
  const subtitulo = document.getElementById('subtitulo');

  const SUBTITULOS = {
    coleta: 'Documentos · Solicitação de ATPV',
    boleto: 'Solicitação de Boleto · Envio ao financeiro',
    suporte: 'Suporte · Envio de documento, multas, etc.'
  };

  function mostrarAba(aba) {
    painelColeta.classList.toggle('ativo', aba === 'coleta');
    painelBoleto.classList.toggle('ativo', aba === 'boleto');
    painelSuporte.classList.toggle('ativo', aba === 'suporte');
    tabColetaBtn.classList.toggle('active', aba === 'coleta');
    tabBoletoBtn.classList.toggle('active', aba === 'boleto');
    tabSuporteBtn.classList.toggle('active', aba === 'suporte');
    subtitulo.textContent = SUBTITULOS[aba];
  }

  tabColetaBtn.addEventListener('click', () => mostrarAba('coleta'));
  tabBoletoBtn.addEventListener('click', () => mostrarAba('boleto'));
  tabSuporteBtn.addEventListener('click', () => mostrarAba('suporte'));

  /* ===================== FORMULÁRIO: DOCUMENTOS ===================== */
  const destinatarioInput = document.getElementById('destinatario');
  const placaInput = document.getElementById('placa');
  const lojaInput = document.getElementById('loja');
  const cnpjInput = document.getElementById('cnpj');
  const chassiInput = document.getElementById('chassi');
  const renavamInput = document.getElementById('renavam');
  const hodometroInput = document.getElementById('hodometro');
  const valorVendaInput = document.getElementById('valorVenda');
  const modeloInput = document.getElementById('modelo');
  const marcaInput = document.getElementById('marca');
  const ufEmplacamentoInput = document.getElementById('ufEmplacamento');

  const cpfCnpjClienteInput = document.getElementById('cpfCnpjCliente');
  const rgClienteInput = document.getElementById('rgCliente');
  const emailClienteInput = document.getElementById('emailCliente');
  const cepClienteInput = document.getElementById('cepCliente');
  const ufClienteInput = document.getElementById('ufCliente');
  const cidadeClienteInput = document.getElementById('cidadeCliente');
  const enderecoClienteInput = document.getElementById('enderecoCliente');
  const numeroClienteInput = document.getElementById('numeroCliente');
  const complementoClienteInput = document.getElementById('complementoCliente');
  const bairroClienteInput = document.getElementById('bairroCliente');

  const emailLojaInput = document.getElementById('emailLoja');
  const produtoLojaInput = document.getElementById('produtoLoja');
  const razaoSocialLojaInput = document.getElementById('razaoSocialLoja');

  const status = document.getElementById('status');
  const form = document.getElementById('emailForm');
  const limparBtn = document.getElementById('limparBtn');

  function maskCNPJColeta(valor) {
    return valor.replace(/\D/g, '').slice(0, 14)
      .replace(/^(\d{2})(\d)/, '$1.$2')
      .replace(/^(\d{2})\.(\d{3})(\d)/, '$1.$2.$3')
      .replace(/\.(\d{3})(\d)/, '.$1/$2')
      .replace(/(\d{4})(\d)/, '$1-$2');
  }

  function maskCpfCnpjColeta(valor) {
    const digitos = valor.replace(/\D/g, '');
    if (digitos.length > 11) return maskCNPJColeta(valor);
    return digitos.slice(0, 11)
      .replace(/(\d{3})(\d)/, '$1.$2')
      .replace(/(\d{3})(\d)/, '$1.$2')
      .replace(/(\d{3})(\d{1,2})$/, '$1-$2');
  }

  function maskCEPColeta(valor) {
    return valor.replace(/\D/g, '').slice(0, 8)
      .replace(/(\d{5})(\d)/, '$1-$2');
  }

  cnpjInput.addEventListener('input', () => {
    cnpjInput.value = maskCNPJColeta(cnpjInput.value);
  });

  cpfCnpjClienteInput.addEventListener('input', () => {
    cpfCnpjClienteInput.value = maskCpfCnpjColeta(cpfCnpjClienteInput.value);
  });

  cepClienteInput.addEventListener('input', () => {
    cepClienteInput.value = maskCEPColeta(cepClienteInput.value);
  });

  form.addEventListener('submit', (e) => {
    e.preventDefault();

    const destinatario = destinatarioInput.value.trim();
    const placa = placaInput.value.trim().toUpperCase();
    const loja = lojaInput.value.trim();
    const cnpj = cnpjInput.value.trim();
    const chassi = chassiInput.value.trim();
    const renavam = renavamInput.value.trim();
    const hodometro = hodometroInput.value.trim();
    const valorVenda = valorVendaInput.value.trim();
    const modelo = modeloInput.value.trim();
    const marca = marcaInput.value.trim();
    const ufEmplacamento = ufEmplacamentoInput.value;

    const cpfCnpjCliente = cpfCnpjClienteInput.value.trim();
    const rgCliente = rgClienteInput.value.trim();
    const emailCliente = emailClienteInput.value.trim();
    const cepCliente = cepClienteInput.value.trim();
    const ufCliente = ufClienteInput.value;
    const cidadeCliente = cidadeClienteInput.value.trim();
    const enderecoCliente = enderecoClienteInput.value.trim();
    const numeroCliente = numeroClienteInput.value.trim();
    const complementoCliente = complementoClienteInput.value.trim();
    const bairroCliente = bairroClienteInput.value.trim();

    const emailLoja = emailLojaInput.value.trim();
    const produtoLoja = produtoLojaInput.value.trim();
    const razaoSocialLoja = razaoSocialLojaInput.value.trim();

    if (!placa || !loja || !cnpj || !chassi || !renavam || !hodometro || !valorVenda || !modelo || !marca || !ufEmplacamento ||
        !cpfCnpjCliente || !rgCliente || !emailCliente || !cepCliente || !ufCliente || !cidadeCliente || !enderecoCliente || !numeroCliente || !bairroCliente ||
        !emailLoja || !produtoLoja || !razaoSocialLoja) {
      status.textContent = 'Preencha todos os campos antes de gerar o email.';
      return;
    }

    const assunto = `Documentos | Novos Negócios - Boleto pago - solicitação de ATPV - Placa: ${placa} - Loja: ${loja} - CNPJ: ${cnpj}`;

    const corpo =
`Prezados(as),
Abaixo, seguem os dados para preenchimento do documento.

Dados do veículo:
Placa: ${placa}
Chassi: ${chassi}
Renavam: ${renavam}
Hodômetro: ${hodometro}
Valor Venda: ${valorVenda}
Modelo: ${modelo}
Marca: ${marca}
UF Emplacamento: ${ufEmplacamento}

Dados do Cliente para Preenchimento:
CPF/CNPJ: ${cpfCnpjCliente}
RG: ${rgCliente}
Email: ${emailCliente}
CEP: ${cepCliente}
UF: ${ufCliente}
Cidade: ${cidadeCliente}
Endereço: ${enderecoCliente}
Nº: ${numeroCliente}
Complemento: ${complementoCliente}
Bairro: ${bairroCliente}

Dados da Loja:
CNPJ: ${cnpj}
Email: ${emailLoja}
Produto: ${produtoLoja}
Razão Social: ${razaoSocialLoja}`;

    const mailtoLink = `mailto:${encodeURIComponent(destinatario)}?subject=${encodeURIComponent(assunto)}&body=${encodeURIComponent(corpo)}`;

    abrirModal(
      'Confira os dados antes de enviar o email.',
      mailtoLink,
      status
    );
  });

  limparBtn.addEventListener('click', () => {
    form.reset();
    status.textContent = 'Formulário limpo.';
  });

  /* ===================== FORMULÁRIO: SOLICITAÇÃO DE BOLETO ===================== */
  const destinatarioBoletoInput = document.getElementById('destinatarioBoleto');
  const lojaBoletoInput = document.getElementById('lojaBoleto');
  const cnpjBoletoInput = document.getElementById('cnpjBoleto');
  const emailBoletoInput = document.getElementById('emailBoleto');
  const placaBoletoInput = document.getElementById('placaBoleto');
  const nomeClienteBoletoInput = document.getElementById('nomeClienteBoleto');
  const cpfBoletoInput = document.getElementById('cpfBoleto');
  const statusBoleto = document.getElementById('statusBoleto');
  const boletoForm = document.getElementById('boletoForm');
  const limparBoletoBtn = document.getElementById('limparBoletoBtn');

  const ruaClienteBoletoInput = document.getElementById('ruaClienteBoleto');
  const numeroClienteBoletoInput = document.getElementById('numeroClienteBoleto');
  const bairroClienteBoletoInput = document.getElementById('bairroClienteBoleto');
  const cepClienteBoletoInput = document.getElementById('cepClienteBoleto');
  const cidadeClienteBoletoInput = document.getElementById('cidadeClienteBoleto');
  const ufClienteBoletoInput = document.getElementById('ufClienteBoleto');

  const ruaEnvioBoletoInput = document.getElementById('ruaEnvioBoleto');
  const numeroEnvioBoletoInput = document.getElementById('numeroEnvioBoleto');
  const bairroEnvioBoletoInput = document.getElementById('bairroEnvioBoleto');
  const cepEnvioBoletoInput = document.getElementById('cepEnvioBoleto');
  const cidadeEnvioBoletoInput = document.getElementById('cidadeEnvioBoleto');
  const ufEnvioBoletoInput = document.getElementById('ufEnvioBoleto');

  function maskCNPJ(valor) {
    return valor.replace(/\D/g, '').slice(0, 14)
      .replace(/^(\d{2})(\d)/, '$1.$2')
      .replace(/^(\d{2})\.(\d{3})(\d)/, '$1.$2.$3')
      .replace(/\.(\d{3})(\d)/, '.$1/$2')
      .replace(/(\d{4})(\d)/, '$1-$2');
  }

  function maskCPF(valor) {
    return valor.replace(/\D/g, '').slice(0, 11)
      .replace(/(\d{3})(\d)/, '$1.$2')
      .replace(/(\d{3})(\d)/, '$1.$2')
      .replace(/(\d{3})(\d{1,2})$/, '$1-$2');
  }

  function maskCpfCnpj(valor) {
    const digitos = valor.replace(/\D/g, '');
    return digitos.length > 11 ? maskCNPJ(valor) : maskCPF(valor);
  }

  function maskCEP(valor) {
    return valor.replace(/\D/g, '').slice(0, 8)
      .replace(/(\d{5})(\d)/, '$1-$2');
  }

  function maskMoeda(valor) {
    let digitos = valor.replace(/\D/g, '');
    if (!digitos) return '';
    const numero = parseInt(digitos, 10) / 100;
    return numero.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
  }

  const valorBoletoInput = document.getElementById('valorBoletoInput');
  valorBoletoInput.addEventListener('input', () => {
    valorBoletoInput.value = maskMoeda(valorBoletoInput.value);
  });

  cnpjBoletoInput.addEventListener('input', () => {
    cnpjBoletoInput.value = maskCNPJ(cnpjBoletoInput.value);
  });

  cpfBoletoInput.addEventListener('input', () => {
    cpfBoletoInput.value = maskCpfCnpj(cpfBoletoInput.value);
  });

  cepClienteBoletoInput.addEventListener('input', () => {
    cepClienteBoletoInput.value = maskCEP(cepClienteBoletoInput.value);
  });

  cepEnvioBoletoInput.addEventListener('input', () => {
    cepEnvioBoletoInput.value = maskCEP(cepEnvioBoletoInput.value);
  });

  boletoForm.addEventListener('submit', (e) => {
    e.preventDefault();

    const destinatario = destinatarioBoletoInput.value;
    const loja = lojaBoletoInput.value.trim();
    const cnpj = cnpjBoletoInput.value.trim();
    const email = emailBoletoInput.value.trim();
    const placa = placaBoletoInput.value.trim().toUpperCase();
    const nomeCliente = nomeClienteBoletoInput.value.trim();
    const cpf = cpfBoletoInput.value.trim();

    const ruaCliente = ruaClienteBoletoInput.value.trim();
    const numeroCliente = numeroClienteBoletoInput.value.trim();
    const bairroCliente = bairroClienteBoletoInput.value.trim();
    const cepCliente = cepClienteBoletoInput.value.trim();
    const cidadeCliente = cidadeClienteBoletoInput.value.trim();
    const ufCliente = ufClienteBoletoInput.value;

    const ruaEnvio = ruaEnvioBoletoInput.value.trim();
    const numeroEnvio = numeroEnvioBoletoInput.value.trim();
    const bairroEnvio = bairroEnvioBoletoInput.value.trim();
    const cepEnvio = cepEnvioBoletoInput.value.trim();
    const cidadeEnvio = cidadeEnvioBoletoInput.value.trim();
    const ufEnvio = ufEnvioBoletoInput.value;
    const valorBoleto = valorBoletoInput.value.trim();

    if (!loja || !cnpj || !email || !placa || !nomeCliente || !cpf ||
        !ruaCliente || !numeroCliente || !bairroCliente || !cepCliente || !cidadeCliente || !ufCliente ||
        !ruaEnvio || !numeroEnvio || !bairroEnvio || !cepEnvio || !cidadeEnvio || !ufEnvio || !valorBoleto) {
      statusBoleto.textContent = 'Preencha todos os campos antes de gerar o email.';
      return;
    }

    const enderecoCliente = `${ruaCliente}, nº ${numeroCliente} - ${bairroCliente} - CEP ${cepCliente} - ${cidadeCliente}/${ufCliente}`;
    const enderecoLoja = `${ruaEnvio}, nº ${numeroEnvio} - ${bairroEnvio} - CEP ${cepEnvio} - ${cidadeEnvio}/${ufEnvio}`;

    const assunto = `Solicitações de Boletos Novos Negócios | Placa: ${placa} - Loja: ${loja} - CNPJ: ${cnpj}`;

    const corpo =
`Prezados(as),
Solicito o boleto e o preenchimento do ATPV com os seguintes dados:

Placa: ${placa}
Valor: ${valorBoleto}

Nome da loja: ${loja}
CNPJ: ${cnpj}
Endereço da loja: ${enderecoLoja}

Nome do cliente: ${nomeCliente}
CPF/CNPJ: ${cpf}
Endereço do cliente: ${enderecoCliente}

Email para envio do boleto: ${email}`;

    const mailtoLink = `mailto:${encodeURIComponent(destinatario)}?subject=${encodeURIComponent(assunto)}&body=${encodeURIComponent(corpo)}`;

    abrirModal(
      'Lembre-se de anexar o print da oferta do email antes de enviar.',
      mailtoLink,
      statusBoleto
    );
  });

  limparBoletoBtn.addEventListener('click', () => {
    boletoForm.reset();
    statusBoleto.textContent = 'Formulário limpo.';
  });

  /* ===================== FORMULÁRIO: SUPORTE ===================== */
  const destinatarioSuporteInput = document.getElementById('destinatarioSuporte');
  const lojaSuporteInput = document.getElementById('lojaSuporte');
  const cnpjSuporteInput = document.getElementById('cnpjSuporte');
  const placaSuporteInput = document.getElementById('placaSuporte');
  const dataRetiradaSuporteInput = document.getElementById('dataRetiradaSuporte');
  const assuntoSuporteInput = document.getElementById('assuntoSuporte');
  const dataPgtoBoletoGroup = document.getElementById('dataPgtoBoletoGroup');
  const dataPgtoBoletoSuporteInput = document.getElementById('dataPgtoBoletoSuporte');
  const descricaoPreviewGroup = document.getElementById('descricaoPreviewGroup');
  const descricaoPreview = document.getElementById('descricaoPreview');
  const statusSuporte = document.getElementById('statusSuporte');
  const suporteForm = document.getElementById('suporteForm');
  const limparSuporteBtn = document.getElementById('limparSuporteBtn');

  function formatarDataCompleta(valorISO) {
    if (!valorISO) return '';
    const [ano, mes, dia] = valorISO.split('-');
    return `${dia}/${mes}/${ano}`;
  }

  cnpjSuporteInput.addEventListener('input', () => {
    cnpjSuporteInput.value = maskCNPJ(cnpjSuporteInput.value);
  });

  function gerarDescricaoSuporte(assunto, dataPgtoBR) {
    const DESCRICOES = {
      'Multa de Trânsito': 'Solicito apoio pois, ao consultarmos os débitos do veículo, identificamos uma multa anterior à data da coleta do carro.',
      'Chave Reserva': 'Solicito apoio pois o veículo não possui a chave reserva.',
      'Boleto com erro': 'Solicito apoio pois o boleto enviado está com erro.',
      'Envio do documento': `Solicito apoio pois efetuamos o pagamento do boleto no dia ${dataPgtoBR || 'xx/xx/xxxx'} e, até o momento, não recebemos o documento.`
    };
    return DESCRICOES[assunto] || '';
  }

  function atualizarDescricaoSuporte() {
    const assunto = assuntoSuporteInput.value;

    if (!assunto) {
      descricaoPreviewGroup.style.display = 'none';
      dataPgtoBoletoGroup.style.display = 'none';
      return;
    }

    const ehEnvioDocumento = assunto === 'Envio do documento';
    dataPgtoBoletoGroup.style.display = ehEnvioDocumento ? 'flex' : 'none';

    const dataPgtoBR = formatarDataCompleta(dataPgtoBoletoSuporteInput.value);
    descricaoPreview.textContent = gerarDescricaoSuporte(assunto, dataPgtoBR);
    descricaoPreviewGroup.style.display = 'flex';
  }

  assuntoSuporteInput.addEventListener('change', atualizarDescricaoSuporte);
  dataPgtoBoletoSuporteInput.addEventListener('change', atualizarDescricaoSuporte);

  suporteForm.addEventListener('submit', (e) => {
    e.preventDefault();

    const destinatario = destinatarioSuporteInput.value;
    const loja = lojaSuporteInput.value.trim();
    const cnpj = cnpjSuporteInput.value.trim();
    const placa = placaSuporteInput.value.trim().toUpperCase();
    const dataRetiradaBR = formatarDataCompleta(dataRetiradaSuporteInput.value);
    const assunto = assuntoSuporteInput.value;
    const ehEnvioDocumento = assunto === 'Envio do documento';
    const dataPgtoBR = formatarDataCompleta(dataPgtoBoletoSuporteInput.value);

    if (!loja || !cnpj || !placa || !dataRetiradaBR || !assunto || (ehEnvioDocumento && !dataPgtoBR)) {
      statusSuporte.textContent = 'Preencha todos os campos antes de gerar o email.';
      return;
    }

    const descricao = gerarDescricaoSuporte(assunto, dataPgtoBR);

    const assuntoEmail = `Suporte - ${assunto} - Placa ${placa} - ${loja} - CNPJ ${cnpj}`;

    const corpo =
`Olá, tudo bem?

Nome da Loja: ${loja}
CNPJ: ${cnpj}
Placa: ${placa}
Data da retirada: ${dataRetiradaBR}
Assunto: ${assunto}

${descricao}`;

    const mailtoLink = `mailto:${encodeURIComponent(destinatario)}?subject=${encodeURIComponent(assuntoEmail)}&body=${encodeURIComponent(corpo)}`;

    abrirModal(
      'Confira os dados antes de enviar o email. Se houver evidências, anexe-as ao email.',
      mailtoLink,
      statusSuporte
    );
  });

  limparSuporteBtn.addEventListener('click', () => {
    suporteForm.reset();
    dataPgtoBoletoGroup.style.display = 'none';
    descricaoPreviewGroup.style.display = 'none';
    statusSuporte.textContent = 'Formulário limpo.';
  });
</script>

</body>
</html>
